{% extends "base.html" %}

{% block title %}
Upload File
{% endblock %}

{% block content %}

<h2>Upload File</h2>

<form method="POST" enctype="multipart/form-data">
    {{ csrf_token() }}

    <label>Select File</label>

    <br><br>

    <input type="file" name="file" required>

    <br><br>

    <button type="submit">
        Upload
    </button>

</form>

{% endblock %}
